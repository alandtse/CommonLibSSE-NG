name: Main CI

on:
  push:
    branches: [ main, ng ]
    paths:
      - '.github/workflows/main_ci.yml'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
  pull_request:
    branches: [ vr, ng, feature/* ]
  workflow_dispatch:

# Cancel a PR's in-flight run when it's superseded by a new push -- the 20-job matrix
# otherwise keeps occupying runner slots for a commit nobody cares about anymore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-vcpkg:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - debug
          - release
        runtime:
          - all
          - flatrim
          - ae
          - se
          - vr
        compiler:
          - msvc
          - clang-cl
    # Persist vcpkg-built dependency binaries in the GitHub Actions cache so the matrix
    # configs (and future runs) restore prebuilt .libs (spdlog, DirectXTK, …) instead of
    # recompiling them every time. Validated: a warm cache turns a dep build into a ~ms
    # restore.
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: main
          submodules: recursive

      - name: Extract vcpkg baseline from vcpkg.json
        id: get_vcpkg_baseline
        shell: pwsh
        run: |
          $vcpkgJson = Get-Content main/vcpkg.json | ConvertFrom-Json
          $baseline = $vcpkgJson.'builtin-baseline'
          echo "baseline=$baseline" >> $env:GITHUB_OUTPUT
          echo "✓ Using vcpkg baseline from vcpkg.json: $baseline"

      - name: Setup MSVC Environment
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      # Pin vcpkg's download cache to a stable, cacheable path. vcpkg checks
      # this directory (by SHA512) before fetching any asset — port source
      # tarballs AND tools acquired via vcpkg_find_acquire_program (e.g. the
      # pinned PowerShell-core zip applocal.ps1 needs). Caching it (below)
      # lets those downloads survive across runs, so a transient GitHub
      # releases 504 on a cache-cold tool fetch can't fail the build.
      - name: Pin vcpkg downloads directory
        shell: bash
        run: echo "VCPKG_DOWNLOADS=${{ github.workspace }}/vcpkg_downloads" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.get_vcpkg_baseline.outputs.baseline }}
          # Bootstrap vcpkg only; do NOT install here. Manifest install runs
          # later during the retry-wrapped cmake configure, so the flaky
          # asset fetches happen inside the retry + with the downloads cache
          # already restored. Explicit so a future default flip can't move
          # the install (and its network I/O) back ahead of those guards.
          runVcpkgInstall: false

      # vcpkg download (asset) cache. Keyed on the manifest + baseline, NOT
      # the compiler — the set of fetched assets only changes when deps or
      # the baseline change, so this survives VS toolset drift. Same
      # trusted-write / untrusted-restore split as the build cache below.
      - name: Cache vcpkg downloads (trusted, restore + save)
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('main/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-

      - name: Restore vcpkg downloads (untrusted PR, restore-only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('main/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-

      # x-gha reads the Actions cache service endpoint from these two variables, which
      # GitHub only exposes to the github-script runtime — re-export them so vcpkg sees them.
      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Pre-install vcpkg deps via a CMake configure, wrapped in retry. This
      # is the only step that hits the network for vcpkg ports/tools, so a
      # transient GitHub-releases 504 (e.g. the PowerShell-core fetch) gets
      # retried here instead of failing the build. The subsequent run-cmake
      # build step re-configures the real build directory fresh, so it sees
      # BUILD_TESTS=ON and builds CommonLibSSETests.exe.
      #
      # IMPORTANT: use -B to redirect to a throwaway directory. If we
      # configured into the preset's real binaryDir with -DBUILD_TESTS=OFF,
      # run-cmake would reuse the CMakeCache.txt with BUILD_TESTS=OFF and
      # the test exe would never be built (the failing mode before this fix).
      - name: Pre-install vcpkg dependencies (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          shell: pwsh
          command: |
            cmake -S "${{ github.workspace }}/main" -B "$env:RUNNER_TEMP/vcpkg-warmup" --preset build-${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }} -DBUILD_TESTS=OFF

      - name: Build
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/main/CMakeLists.txt
          configurePreset: build-${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}
          configurePresetAdditionalArgs: "['-DCOMMONLIB_ENABLE_IPO=OFF']"
          buildPreset: ${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}

      - name: Unit tests
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}/main/build/${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}
        run: .\CommonLibSSETests.exe

  # Proves the Linux-host cross-compile toolchain (examples/linux-cross-compile/)
  # keeps working, targeting the same Windows PE/MSVC ABI output as the
  # windows-latest jobs above. Deliberately a single build (clang-cl, all
  # runtimes) rather than a full matrix, and build-only (the output is a
  # Windows PE test exe a Linux runner can't execute natively) to keep this
  # cheap on runner minutes.
  build-linux-cross-compile:
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      XWIN_SYSROOT: ${{ github.workspace }}/xwin-out
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: main
          submodules: recursive

      - name: Extract vcpkg baseline from vcpkg.json
        id: get_vcpkg_baseline
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('main/vcpkg.json'))['builtin-baseline'])")
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build wine

      - name: Cache xwin sysroot
        id: cache-xwin
        uses: actions/cache@v4
        with:
          path: ${{ env.XWIN_SYSROOT }}
          key: xwin-sysroot-0.6.5-10.0.26100

      - name: Generate xwin sysroot
        if: steps.cache-xwin.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/Jake-Shadle/xwin/releases/download/0.6.5/xwin-0.6.5-x86_64-unknown-linux-musl.tar.gz | tar xz
          mv xwin-0.6.5-x86_64-unknown-linux-musl/xwin /usr/local/bin/xwin
          xwin --accept-license --cache-dir "${{ runner.temp }}/xwin-cache" splat \
            --output "${{ env.XWIN_SYSROOT }}" --include-debug-libs \
            --use-winsysroot-style --preserve-ms-arch-notation

      - name: Install llvm-mingw (for the fxc2 shader-compiler stand-in, see examples/linux-cross-compile)
        run: |
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20250910/llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64.tar.xz | tar xJ
          echo "$PWD/llvm-mingw-20250910-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.get_vcpkg_baseline.outputs.baseline }}
          runVcpkgInstall: false

      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        run: cmake -S main -B main/build/release-linux-clangcl-vcpkg-all --preset build-release-linux-clangcl-vcpkg-all -DCOMMONLIB_ENABLE_IPO=OFF -DBUILD_TESTS=OFF
        working-directory: ${{ github.workspace }}

      - name: Build
        run: cmake --build main/build/release-linux-clangcl-vcpkg-all
        working-directory: ${{ github.workspace }}

      - name: Verify output exists
        run: test -f main/build/release-linux-clangcl-vcpkg-all/CommonLibSSE.lib
